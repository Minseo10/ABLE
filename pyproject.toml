[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "able"
version = "0.1.0"
description = "ABLE: learn to plan faster from dreamed belief updates (limb MPC, friction POMCPOW, human reach PDDLStream)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "torch",
    "matplotlib",
    "pillow",
    "imageio",
    "imageio-ffmpeg",
    "pyyaml",
    "wandb",
    "pybullet_helpers>=0.1.0",
    "psutil",
    "gymnasium",
    # Pinned so every machine runs the same envs and planner.
    "kindergarden @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kindergarden.git@3f57bb6e07f89f8701e6b86410c773860ea9db2d",
    "kinder_models @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kinder-baselines.git@0c13d8bb70d7edbb605db166dbfc82d1c2a432fd#subdirectory=kinder-models",
    "pddlstream @ git+https://github.com/Princeton-Robot-Planning-and-Learning/pddlstream.git@5919a844b8c947acdb49bedb6e8b2b93e6a70c0c",
]

[project.optional-dependencies]
develop = [
    "pytest>=7.2.2",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
able = ["**/*.pddl"]
